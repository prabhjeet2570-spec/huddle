name: huddle

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: huddle
      POSTGRES_PASSWORD: huddle
      POSTGRES_DB: huddle
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huddle -d huddle"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"
    profiles: ["observability"]

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HUDDLE_DATABASE_URL: postgresql+asyncpg://huddle:huddle@db:5432/huddle
      HUDDLE_JWT_SECRET: dev-only-secret-change-me-in-production-please
      HUDDLE_LLM_API_KEY: ${HUDDLE_LLM_API_KEY:-}
      HUDDLE_LLM_PROVIDER: ${HUDDLE_LLM_PROVIDER:-openai}
      HUDDLE_SEED_ON_STARTUP: "true"
      HUDDLE_SEED_USER_PASSWORD: ${HUDDLE_SEED_USER_PASSWORD:-huddle-dev-password}
      HUDDLE_OTEL_ENABLED: ${HUDDLE_OTEL_ENABLED:-false}
      HUDDLE_OTEL_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"

  ui:
    build: .
    depends_on:
      - api
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      HUDDLE_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"

volumes:
  db-data:
