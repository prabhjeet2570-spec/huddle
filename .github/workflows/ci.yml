name: Validate Huddle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huddle
          POSTGRES_PASSWORD: huddle
          POSTGRES_DB: huddle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U huddle"
          --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://huddle:huddle@localhost:5432/huddle_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.9"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check app tests scripts
      - run: uv run ruff format --check app tests scripts
      - run: uv run pytest -q
      - run: node --check app/static/app.js
      - run: uv run python scripts/workflow_demo.py
      - run: uv run python scripts/recovery_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-evidence
          path: |
            artifacts/recovery-results.json
            artifacts/workflow-restart.json
      - run: docker build -t huddle:ci .
